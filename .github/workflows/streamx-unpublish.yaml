name: Unpublish from StreamX

on:
  repository_dispatch:
    types:
      - resource-unpublished

permissions:
  id-token: write
  contents: read

jobs:
  check-event-status:
    runs-on: ubuntu-latest
    steps:
      - env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          echo $CLIENT_PAYLOAD
          echo "Status: ${{ github.event.client_payload.status }}"
          echo "Path: ${{ github.event.client_payload.path }}"

  unpublish-from-streamx:
    if: (github.event.client_payload.status == 200 || github.event.client_payload.status == 204) && endsWith(github.event.client_payload.path, '.md')
    runs-on: ubuntu-latest
    steps:
      - name: Prepare ingestion variables
        id: vars
        shell: bash
        env:
          # From the payload, through env rather than inlined into the script.
          RESOURCE_PATH: ${{ github.event.client_payload.path }}
        run: |
          # The subject is the index document id. It MUST be derived exactly as
          # streamx-publish.yaml derives it, or the unpublish names a document
          # that does not exist and the page stays searchable.
          streamx_path=$(echo "$RESOURCE_PATH" | sed 's/\.md$//g')
          if [[ "$streamx_path" =~ ^/([a-z]{2}(-[a-z]{2})?)(/|$) ]]; then
            streamx_namespace="${BASH_REMATCH[1]}:"
          else
            streamx_namespace=""
          fi
          streamx_subject=${streamx_namespace}${streamx_path}
          if [ -z "$streamx_path" ]; then
            echo "::error::client_payload.path is empty; nothing to unpublish"
            exit 1
          fi
          echo "CloudEvent subject: ${streamx_subject}"
          echo "streamx_subject=${streamx_subject}" >> "$GITHUB_OUTPUT"

      - name: Run unpublish from StreamX
        uses: streamx-hub/streamx-common-github-actions/.github/actions/connector-github@v1
        env:
          STREAMX_CONNECTION_SOCKET_TIMEOUT: 3000
        with:
          event-type: 'com.streamx.blueprints.page.unpublished.v1'
          subject: ${{ steps.vars.outputs.streamx_subject }}
          streamx-ingestion-token: ${{ secrets.STREAMX_INGESTION_GH_TOKEN }}
          streamx-ingestion-url: ${{ vars.STREAMX_INGESTION_URL }}